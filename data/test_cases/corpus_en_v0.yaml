    prompt: |
      Caesar cipher is an ancient, elementary method of encrypting a plain text
      message into cipher text, protecting it from adversaries. However, with
      the advent of powerful computers, there is a need for increasing the
      complexity of such techniques. This paper contributes to classical
      cryptography by providing a modified and expanded version of the Caesar
      cipher using knowledge of mathematics and computer science. To increase
      the strength of this classical encryption technique, the proposed
      algorithm uses affine ciphers, transposition ciphers and randomized
      substitution to create a cipher text which is nearly impossible to decode.
      It also increases the range of characters the algorithm can encrypt by
      including all ASCII and extended ASCII characters in addition to the
      alphabet. A complex key generation technique that derives two keys from a
      single key provides enhanced security.

      In today's information age it is impossible to imagine the world without
      the internet. This era is dominated by paperless offices, mail messages,
      cash transactions and virtual stores. Large amounts of data are
      transferred between computers over the internet for professional as well
      as personal reasons. Because those machines are interconnected, the
      communication channels they use are exposed to unauthorized access, and
      securing such data has become necessary. The obvious defence would be
      physical security, but for reasons of cost and efficiency that is not
      always feasible. This led to the branch of virtual security methods known
      as cryptography, from the Greek Kryptos, used to describe anything hidden,
      obscure, secret or mysterious.

      Cryptography concerns itself with four main objectives: confidentiality,
      integrity, non-repudiation and authentication. It divides into symmetric
      and asymmetric key cryptography. In symmetric key cryptography a single
      key is shared between sender and receiver. In asymmetric key cryptography
      each user is assigned a public and a private key; the sender encrypts with
      the receiver's public key and the receiver decrypts with their own private
      key.

