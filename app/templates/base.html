<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LLM Security Test Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">🛡️ LLM Security Test Lab</a>
    <span class="subtitle">system-prompt defense testing</span>
    <nav class="topnav">
      <a href="{{ url_for('main.index') }}">Çalıştır</a>
      <a href="{{ url_for('main.compare') }}">Karşılaştır</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
