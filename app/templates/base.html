<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LLM Security Test Lab{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}">
      <span style="color:var(--accent)">◆</span> LLM Security Test Lab
    </a>
    <span class="subtitle">defense benchmarking</span>
    <nav class="topnav">
      <a href="{{ url_for('main.index') }}">Çalıştır</a>
      <a href="{{ url_for('main.corpus_list') }}">Corpus</a>
      <a href="{{ url_for('main.manual_test') }}">Manuel</a>
      <a href="{{ url_for('main.compare') }}">Karşılaştır</a>
      <a href="{{ url_for('main.architecture') }}">Mimari</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
